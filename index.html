<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickSetup</title>
  <link rel="icon" href="template.ico?v=3">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      display: flex;
      background: #0f172a;
      color: #e5e7eb;
    }

    /* 🔥 SIDEBAR */
    .sidebar {
      width: 85px;
      height: 100vh;
      background: #020617;
      position: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      gap: 18px;
      border-right: 1px solid #111;
    }

    .nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: .2s;
      font-size: 20px;
    }

    .nav-btn:hover {
      background: #2563eb;
      transform: scale(1.1);
    }

    .content {
      margin-left: 85px;
      width: 100%;
      position: relative;
    }

    section {
      min-height: 100vh;
      padding: 60px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .card {
      max-width: 800px;
      width: 100%;
      background: #020617;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 0 50px rgba(37,99,235,.25);
      text-align: center;
    }

    /* 🔥 TÍTULO GELATINOSO */
    .main-title {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translate(-50%, -50%);

      font-size: 100px;
      font-weight: 900;
      color: white;

      animation: jelly 3s ease-in-out infinite;
      text-shadow: 0 0 25px rgba(255,255,255,.15);
    }

    /* ✨ ANIMAÇÃO MOLENGA */
    @keyframes jelly {
      0%   { transform: translate(-50%, -50%) scale(1,1); }
      20%  { transform: translate(-50%, -50%) scale(1.1,.9); }
      35%  { transform: translate(-50%, -50%) scale(.9,1.1); }
      50%  { transform: translate(-50%, -50%) scale(1.05,.95); }
      65%  { transform: translate(-50%, -50%) scale(.98,1.02); }
      80%  { transform: translate(-50%, -50%) scale(1.02,.98); }
      100% { transform: translate(-50%, -50%) scale(1,1); }
    }

    #home .card {
      margin-top: 140px;
    }

    h2 {
      margin-bottom: 20px;
    }

    p {
      opacity: .85;
      margin-bottom: 20px;
    }

    ul {
      list-style: none;
    }

    ul li {
      margin: 6px 0;
    }

    img {
      width: 100%;
      border-radius: 14px;
      margin-top: 20px;
    }

    .btn {
      display: inline-block;
      padding: 16px 40px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      margin-top: 20px;
      transition: .2s;
      font-weight: bold;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: scale(1.05);
    }

    /* 🌞 modo claro */
    body.claro {
      background: #f3f3f3;
      color: #111;
    }

    body.claro .sidebar {
      background: #e5e7eb;
    }

    body.claro .card {
      background: white;
    }

  </style>
</head>

<body>

  <div class="sidebar">
    <div class="nav-btn" onclick="go('home')">🏠</div>
    <div class="nav-btn" onclick="go('sobre')">📄</div>
    <div class="nav-btn" onclick="go('prints')">🖼️</div>
    <div class="nav-btn" onclick="go('download')">⬇️</div>
    <div class="nav-btn" id="toggle-theme">🌙</div>
  </div>

  <div class="content">

    <!-- HOME -->
    <section id="home">

      <h1 class="main-title">QuickSetup</h1>

      <div class="card">
        <p>Seu PC pronto em minutos 🚀</p>

        <a class="btn"
        href="https://github.com/el-abacaxiu/QuickSetup/releases/download/v1.0/QuickSetup.zip">
          Baixar Agora
        </a>
      </div>
    </section>

    <!-- SOBRE -->
    <section id="sobre">
      <div class="card">
        <h2>Sobre o Projeto</h2>
        <p>Instala automaticamente os apps essenciais pra deixar o PC pronto.</p>

        <ul>
          <li>✔ Automático</li>
          <li>✔ Leve</li>
          <li>✔ Rápido</li>
          <li>✔ Gratuito</li>
        </ul>
      </div>
    </section>

    <!-- PRINTS -->
    <section id="prints">
      <div class="card">
        <h2>Preview</h2>
        <img src="print01.jpeg">
      </div>
    </section>

    <!-- DOWNLOAD -->
    <section id="download">
      <div class="card">
        <h2>Download</h2>
        <p>Version release initial V1.3 🚀</p>

        <a class="btn"
        href="https://github.com/el-abacaxiu/QuickSetup/releases/download/v1.0/QuickSetup.zip">
          Baixar ZIP
        </a>
      </div>
    </section>

  </div>

  <script>
    function go(id){
      document.getElementById(id).scrollIntoView();
    }

    const btnTema = document.getElementById("toggle-theme");

    btnTema.addEventListener("click", () => {
      document.body.classList.toggle("claro");
      btnTema.textContent =
        document.body.classList.contains("claro") ? "☀️" : "🌙";
    });
  </script>

</body>
</html>
