<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickSetup</title>
  <link rel="icon" href="template.ico?v=2">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      display: flex;
      background: #0f172a;
      color: #e5e7eb;
    }

    /* 🔥 SIDEBAR */
    .sidebar {
      width: 85px;
      height: 100vh;
      background: #020617;
      position: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      gap: 18px;
      border-right: 1px solid #111;
    }

    .nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: .2s;
      font-size: 20px;
    }

    .nav-btn:hover {
      background: #2563eb;
      transform: scale(1.1);
    }

    /* 🔥 CONTEÚDO */
    .content {
      margin-left: 85px;
      width: 100%;
    }

    section {
      min-height: 100vh;
      padding: 60px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      max-width: 800px;
      width: 100%;
      background: #020617;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0,0,0,.6);
      text-align: center;
    }

    h1 {
      font-size: 64px;
      margin-bottom: 15px;
    }

    h2 {
      margin-bottom: 20px;
    }

    p {
      opacity: .85;
      margin-bottom: 20px;
    }

    img {
      width: 100%;
      border-radius: 14px;
      margin-top: 20px;
    }

    .btn {
      display: inline-block;
      padding: 16px 40px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      margin-top: 20px;
      transition: .2s;
      font-weight: bold;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: scale(1.05);
    }

    /* 🌞 TEMA CLARO */
    body.claro {
      background: #f3f3f3;
      color: #111;
    }

    body.claro .sidebar {
      background: #e5e7eb;
    }

    body.claro .card {
      background: white;
    }

  </style>
</head>

<body>

  <!-- 🔥 SIDEBAR -->
  <div class="sidebar">
    <div class="nav-btn" onclick="go('home')">🏠</div>
    <div class="nav-btn" onclick="go('sobre')">📄</div>
    <div class="nav-btn" onclick="go('prints')">🖼️</div>
    <div class="nav-btn" onclick="go('download')">⬇️</div>
    <div class="nav-btn" id="toggle-theme">🌙</div>
  </div>


  <div class="content">

    <!-- HOME -->
    <section id="home">
      <div class="card">
        <h1>QuickSetup</h1>
        <p>Seu PC pronto em minutos 🚀</p>

        <a class="btn"
        href="https://github.com/el-abacaxiu/QuickSetup/releases/download/v1.0/QuickSetup.zip">
          Baixar Agora
        </a>
      </div>
    </section>


    <!-- SOBRE -->
    <section id="sobre">
      <div class="card">
        <h2>Sobre o Projeto</h2>
        <p>
          O QuickSetup instala automaticamente os apps essenciais
          para deixar o PC pronto para jogos ou uso diário.
          Ideal após formatar o computador.
        </p>
      </div>
    </section>


    <!-- PRINTS -->
    <section id="prints">
      <div class="card">
        <h2>Preview</h2>
        <img src="print01.jpeg">
      </div>
    </section>


    <!-- DOWNLOAD -->
    <section id="download">
      <div class="card">
        <h2>Download</h2>
        <a class="btn"
        href="https://github.com/el-abacaxiu/QuickSetup/releases/download/v1.0/QuickSetup.zip">
          Baixar ZIP
        </a>
      </div>
    </section>

  </div>


  <script>
    function go(id){
      document.getElementById(id).scrollIntoView();
    }

    const btnTema = document.getElementById("toggle-theme");

    btnTema.addEventListener("click", () => {
      document.body.classList.toggle("claro");
      btnTema.textContent =
        document.body.classList.contains("claro") ? "☀️" : "🌙";
    });
  </script>

</body>
</html>
