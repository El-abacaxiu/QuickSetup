<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickSetup</title>
  <link rel="icon" href="template.ico?v=3">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    :root {
      --bg-main: #1a1a1a;
      --bg-sidebar: #151515;
      --bg-card: #242424;
      --hover: #2e2e2e;

      --accent: #3b82f6;
      --accent-hover: #2563eb;

      --text: #eaeaea;
      --text-soft: #bdbdbd;
    }

    body {
      display: flex;
      background: var(--bg-main);
      color: var(--text);
    }

    /* 🔥 SIDEBAR */
    .sidebar {
      width: 85px;
      height: 100vh;
      background: var(--bg-sidebar);
      position: fixed;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding-top: 20px;
      gap: 18px;

      border-right: 1px solid #2a2a2a;
      transition: .25s;
    }

    .sidebar.closed {
      width: 0;
      overflow: hidden;
    }

    .nav-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--bg-card);

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      transition: .15s;
      font-size: 20px;
    }

    .nav-btn:hover {
      background: var(--hover);
      transform: scale(1.08);
    }

    /* 🔥 CONTEÚDO */
    .content {
      margin-left: 85px;
      width: 100%;
      transition: .25s;
    }

    .content.full {
      margin-left: 0;
    }

    section {
      min-height: 100vh;
      padding: 60px 40px;

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;
    }

    /* 🔥 CARD */
    .card {
      max-width: 800px;
      width: 100%;
      background: var(--bg-card);
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,.45);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    p {
      color: var(--text-soft);
      margin-bottom: 20px;
    }

    img.preview {
      width: 100%;
      border-radius: 14px;
      margin-top: 20px;
    }

    /* 🔥 BOTÃO */
    .btn {
      display: inline-block;
      padding: 14px 36px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      transition: .15s;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    /* 🔥 TÍTULO */
    .main-title {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translate(-50%, -50%);

      display: flex;
      align-items: center;
      gap: 18px;

      font-size: 90px;
      font-weight: 900;
      opacity: .95;
    }

    .title-logo {
      width: 95px;
      height: 95px;
      object-fit: contain;
    }

    #home .card {
      margin-top: 140px;
    }

    /* 🌞 MODO CLARO */
    body.claro {
      --bg-main: #f3f4f6;
      --bg-sidebar: #e5e7eb;
      --bg-card: #ffffff;
      --hover: #dcdcdc;

      --text: #111;
      --text-soft: #555;
    }

    /* 🔗 BOTÃO GITHUB FLUTUANTE */
    .github-float {
      position: fixed;
      bottom: 25px;
      right: 25px;

      width: 60px;
      height: 60px;

      border-radius: 50%;
      background: #333;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      text-decoration: none;

      box-shadow: 0 6px 18px rgba(0,0,0,.5);

      transition: .2s;
      z-index: 999;
    }

    .github-float:hover {
      background: #444;
      transform: scale(1.12) rotate(6deg);
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="nav-btn" id="toggle-menu">☰</div>
    <div class="nav-btn" onclick="go('home')">🏠</div>
    <div class="nav-btn" onclick="go('sobre')">📄</div>
    <div class="nav-btn" onclick="go('prints')">🖼️</div>
    <div class="nav-btn" onclick="go('download')">⬇️</div>
    <div class="nav-btn" id="toggle-theme">🌙</div>
  </div>

  <div class="content">

    <section id="home">
      <div class="main-title">
        <img src="template.jpg" class="title-logo">
        <span>QuickSetup</span>
      </div>

      <div class="card">
        <p>Seu PC pronto em minutos 🚀</p>

        <a class="btn"
        href="https://github.com/el-abacaxiu/QuickSetup/releases/download/v1.0/QuickSetup.zip">
          Baixar Agora
        </a>
      </div>
    </section>

    <section id="sobre">
      <div class="card">
        <h2>Sobre o Projeto</h2>
        <p>
          O QuickSetup instala automaticamente os apps essenciais
          para deixar o PC pronto para jogos ou uso diário.
        </p>
      </div>
    </section>

    <section id="prints">
      <div class="card">
        <h2>Preview</h2>
        <img src="print03.jpeg" class="preview">
      </div>
    </section>

    <section id="download">
      <div class="card">
        <h2>Download</h2>
        <p>Version release initial V1.5 🚀</p>

        <a class="btn"
        href="https://github.com/el-abacaxiu/QuickSetup/releases/download/v1.0/QuickSetup.zip">
          Baixar ZIP
        </a>
      </div>
    </section>

  </div>

  <!-- 🔗 BOTÃO FLUTUANTE -->
  <a class="github-float"
     href="https://github.com/el-abacaxiu/QuickSetup"
     target="_blank">
     🐙
  </a>

  <script>
    function go(id){
      document.getElementById(id).scrollIntoView();
    }

    const btnTema = document.getElementById("toggle-theme");
    btnTema.addEventListener("click", () => {
      document.body.classList.toggle("claro");
      btnTema.textContent =
        document.body.classList.contains("claro") ? "☀️" : "🌙";
    });

    const sidebar = document.querySelector(".sidebar");
    const content = document.querySelector(".content");
    const toggleMenu = document.getElementById("toggle-menu");

    toggleMenu.addEventListener("click", () => {
      sidebar.classList.toggle("closed");
      content.classList.toggle("full");
    });
  </script>

</body>
</html>
